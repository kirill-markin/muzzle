<header>
  <div class="header-desktop-container">
    <div class="left-column">
      {% unless page.url == "/"  %}
      <a href="/" class="header-desktop-button header-logo">MAIN</a>
      {% endunless %}
    </div>
    <div class="right-column">
      <a class="header-desktop-button header-services" href="/services/">Services</a>
      <a class="header-desktop-button header-pay" href="/pay/" style="display: none;">Pay</a>
      <a class="header-desktop-button header-blog" href="https://articles.kirill-markin.com/" target="_blank" rel="noopener noreferrer">Blog</a>
      <a class="header-desktop-button header-book-a-meeting" href="/meet/short/" rel="noopener noreferrer">Talk to Kirill</a>
    </div>
  </div>
  <div class="header-mobile">
    <div class="header-mobile-container">
      <div class="header-mobile-button-container">
        <button class="header-mobile-button closed">
          <div class="header-mobile-button-closed">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M14 12H4M18 17H4M20 7H4" stroke="#232323" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="header-mobile-button-open">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M6 6L18 18" stroke="#232323" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M18 6L6 18" stroke="#232323" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </button>
      </div>
      <div class="mobile-blog-link">
        <a href="https://articles.kirill-markin.com/" target="_blank" rel="noopener noreferrer" class="header-mobile-blog-button">Blog</a>
      </div>
    </div>
    <div class="header-mobile-menu-open hidden">
      <div class="header-mobile-menu-section title">
        <a href="/">Kirill Markin</a>
      </div>
      <div class="header-mobile-menu-section button">
        <a href="/services">Services</a>
      </div>
      <div class="header-mobile-menu-section button">
        <a href="https://articles.kirill-markin.com/" target="_blank" rel="noopener noreferrer">Blog</a>
      </div>
      <div class="header-mobile-menu-section button">
        <a class="header-mobile-book-a-meeting" href="/meet/short/" rel="noopener noreferrer">
          Talk to Kirill
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4.22559 20L20 4M20 4V17M20 4H7" stroke="#353C2A" stroke-width="2"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</header>
<script src="{{ '/assets/js/mobile-menu.js' | relative_url }}"></script>
