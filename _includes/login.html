<style>
    .auth-container {
        position: relative;
        display: inline-block;
    }
    
    .get-started-btn {
        background-color: #800080;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        font-size: var(--font-size-medium, 1.375rem);
    }
    
    .get-started-btn:hover {
        background-color: #3367D6;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    
    .providers-popup {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 0;
        padding-top: 12px;
        display: none;
        flex-direction: row;
        gap: 15px;
        background: transparent;
        z-index: 10;
    }
    
    .auth-container:hover .providers-popup {
        display: flex;
    }
    
    .providers-popup-inner {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        display: flex;
        gap: 15px;
        position: relative;
    }
    
    .triangle {
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 8px solid white;
    }
    
    .provider-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .provider-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    
    .linkedin {
        background-color: #0077B5;
    }
    
    .google {
        background-color: #DB4437;
    }
    
    .microsoft {
        background-color: #00A4EF;
    }
    
    .provider-icon {
        width: 24px;
        height: 24px;
        fill: white;
    }
    
    .footer-login {
        margin-top: 10px;
        display: flex;
        justify-content: center;
    }
    
    .footer-login .get-started-btn {
        width: 100%;
    }
    
    .footer-login .providers-popup {
        display: none;
        flex-direction: row;
    }
    
    .footer-login .auth-container:hover .providers-popup {
        display: flex;
    }
    
    .footer-login .providers-popup-inner {
        flex-direction: row;
    }
</style>

<div class="footer-login auth-container">
    <button class="get-started-btn">Get Started</button>
    <div class="providers-popup">
        <div class="triangle"></div>
        <div class="providers-popup-inner">
            <button id="linkedin-login-footer" class="provider-btn linkedin" title="Continue with LinkedIn">
                <svg class="provider-icon" viewBox="0 0 24 24">
                    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                </svg>
            </button>
            <button id="google-login-footer" class="provider-btn google" title="Continue with Google">
                <svg class="provider-icon" viewBox="0 0 24 24">
                    <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/>
                </svg>
            </button>
            <button id="microsoft-login-footer" class="provider-btn microsoft" title="Continue with Microsoft">
                <svg class="provider-icon" viewBox="0 0 24 24">
                    <path d="M11.4 24H0V12.6h11.4V24zM24 24H12.6V12.6H24V24zM11.4 11.4H0V0h11.4v11.4zM24 11.4H12.6V0H24v11.4z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    // Initialize on page load
    window.addEventListener('load', async () => {
        try {
            const { isAuthenticated, user } = await checkAuth0Session();
            
            if (!isAuthenticated) {
                // Add event handlers for login buttons
                document.getElementById('linkedin-login-footer').addEventListener('click', () => loginWithAuth0Provider('linkedin'));
                document.getElementById('google-login-footer').addEventListener('click', () => loginWithAuth0Provider('google-oauth2'));
                document.getElementById('microsoft-login-footer').addEventListener('click', () => loginWithAuth0Provider('windowslive'));
            }
        } catch (error) {
            console.error("Footer login initialization error:", error);
        }
    });
</script>
