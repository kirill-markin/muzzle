{% include favicon.html %}
{% include gtm.html %}
{% include languages.html %}

<meta charset='utf-8'>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">

<!-- Facebook verification -->
<meta name="facebook-domain-verification" content="rpifi31ud2vorjq461mtqwdjltvbao" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:image" content="{{ site.url }}/assets/images/social-preview.jpg">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta name="twitter:image" content="{{ site.url }}/assets/images/social-preview.jpg">

<link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/media-mentions.css?v=' | append: site.github.build_revision | relative_url }}">
<link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/services.css?v=' | append: site.github.build_revision | relative_url }}">
<link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/emoji-bubbles.css?v=' | append: site.github.build_revision | relative_url }}">
